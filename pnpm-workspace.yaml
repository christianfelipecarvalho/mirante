packages:
  - 'packages/*'
  - 'apps/*'

# Native and platform binaries this project trusts to run install scripts.
# better-sqlite3 compiles (or downloads) a native addon; esbuild fetches its binary.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # CPU inference binaries are already bundled; its script downloads unused CUDA.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
