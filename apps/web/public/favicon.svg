<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Mirante">
  <title>Mirante</title>
  <!--
    A lookout tower: the high point you climb to take in the whole valley at
    once. Drawn as flat geometry with wide strokes so it survives 16px, where a
    favicon actually lives.
  -->
  <g fill="none" stroke="#3987e5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs, splayed -->
    <path d="M12 15 L9 27" />
    <path d="M20 15 L23 27" />
    <!-- cross brace -->
    <path d="M10.4 21.5 L21.6 21.5" />
  </g>
  <!-- viewing platform -->
  <path d="M6.5 11.5 h19 l-3.6 4 H10.1 Z" fill="#3987e5" />
  <!-- the watcher -->
  <circle cx="16" cy="6" r="2.6" fill="#3987e5" />
</svg>
